<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Name</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/registration.css">
    <link rel="stylesheet" href="../css/header.css">
    <script src="../js/header.js"></script>
</head>

<body>
<div id="mainContainer">

    <div class="bannerDisplay">
        <img class="banner" src="../resources/images/shopRegistrationBanner.jpg">
    </div>

    <div id="registerSection">
        <div id=registerMenu>
            <div id="registerOptions">
                <button>Sign In</button>
                <button>Register</button>
            </div>
    
            <div id="registerInfo">
                <form>
                    <div class="registerInput">
                        <label>Email Address</label>
                        <input type="text" placeholder="Email">
                    </div>
                    
                    <div class="registerInput">
                        <label>Password</label>
                        <input type="password" placeholder="Password">
                    </div>
                    
                    <button id="registerInfoSubmit">Sign In</button>
                </form>
            </div>
        </div>
    
    </div>

    <div class="bannerDisplay">
        <img class="banner" src="../resources/images/shopRegistrationBanner2.jpg">
    </div>

</div>


</body>


</html>
